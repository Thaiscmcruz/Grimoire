<!DOCTYPE html>
<html lang="en" data-palette="spring">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7d9e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<link rel="manifest" href="manifest.webmanifest">
<title>Grimoire — Finance</title>
<style>
  :root {
    --radius: 16px;
    --radius-sm: 10px;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html[data-palette="spring"] {
    --bg-1: #fbeef3; --bg-2: #eef3e6; --panel: #fffafc; --panel-2: #fdf1f5;
    --ink: #4a2f3d; --muted: #977f8a; --line: #f0dbe3;
    --accent: #d98aa8; --accent-ink: #fff; --accent-soft: #f7e0e9;
    --income: #6fae7d; --expense: #d9788a; --glow: rgba(217,138,168,.28);
  }
  html[data-palette="summer"] {
    --bg-1: #fff2e0; --bg-2: #ffe6e0; --panel: #fffaf3; --panel-2: #fff0e4;
    --ink: #5a3b2b; --muted: #a5836c; --line: #f4ddc7;
    --accent: #e8935f; --accent-ink: #fff; --accent-soft: #fbe3d1;
    --income: #6bab86; --expense: #e07a5f; --glow: rgba(232,147,95,.28);
  }
  html[data-palette="autumn"] {
    --bg-1: #f6e7d8; --bg-2: #efd9c6; --panel: #fdf4ea; --panel-2: #f7e7d5;
    --ink: #4d3320; --muted: #997e63; --line: #e8d2ba;
    --accent: #b5652f; --accent-ink: #fff; --accent-soft: #efd8c2;
    --income: #7a9a5c; --expense: #c0603a; --glow: rgba(181,101,47,.26);
  }
  html[data-palette="winter"] {
    --bg-1: #eef2f7; --bg-2: #e6ecf3; --panel: #fbfcfe; --panel-2: #eef3f8;
    --ink: #2f3b4a; --muted: #7d8b9c; --line: #dde5ee;
    --accent: #6d8fb8; --accent-ink: #fff; --accent-soft: #dfe8f2;
    --income: #5c9a8f; --expense: #c1738a; --glow: rgba(109,143,184,.26);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  .app { max-width: 620px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; overflow-x: hidden; }
  body { overflow-x: hidden; }

  /* ---------- sketch icons ---------- */
  .ic {
    width: 1.2em; height: 1.2em; flex: none;
    stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.22em;
    filter: url(#sketch);
  }
  .ic.sm { width: 1em; height: 1em; }
  .ic.lg { width: 1.55em; height: 1.55em; }
  .ic.nav { width: 22px; height: 22px; stroke-width: 1.6; }
  @media (prefers-reduced-motion: reduce) { .ic { filter: none; } }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
  .menu-btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 14px -8px var(--glow);
  }
  .topbar .mark { color: var(--accent); display: grid; place-items: center; }
  .topbar h1 { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .3px; }
  .topbar .sub { color: var(--muted); font-size: 12px; margin-left: auto; text-transform: capitalize; }

  /* ---------- drawer ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(40,20,35,.34);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 70;
    width: 78%; max-width: 288px;
    background: var(--panel); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .24s cubic-bezier(.3,.7,.3,1);
    display: flex; flex-direction: column; gap: 3px;
    padding: 20px 12px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 12px 0 40px -20px var(--glow);
  }
  .drawer.open { transform: none; }
  .drawer .brand { display: flex; align-items: center; gap: 10px; padding: 6px 12px 16px; }
  .drawer .brand .mark { color: var(--accent); }
  .drawer .brand b { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    padding: 12px 12px; border-radius: 12px; border: none; background: transparent;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .nav-item .ic { color: var(--muted); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); }
  .nav-item[aria-current="true"] .ic { color: var(--accent); }
  .drawer .foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: 11.5px; }

  /* ---------- view / cards ---------- */
  main { flex: 1; padding: 4px 14px 48px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
    box-shadow: 0 6px 20px -12px var(--glow), 0 1px 2px rgba(0,0,0,.03);
  }
  .card h2 { font-family: var(--serif); font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; row-gap: 6px; }
  .card h2 .spacer { margin-left: auto; }
  .card h2 .small { white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
  .center { text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 13.5px; }
  .warn { color: var(--expense); }

  /* ---------- forms ---------- */
  label.field { display: block; margin-bottom: 10px; }
  label.field > span { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: .03em; text-transform: uppercase; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .amount-input { font-size: 26px; font-family: var(--serif); text-align: center; padding: 14px; letter-spacing: .5px; }

  button {
    cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 10px 14px; background: var(--accent-soft); transition: filter .15s, transform .05s;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; padding: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  button.primary:hover { filter: brightness(1.05); }
  button.ghost { background: transparent; border-color: var(--line); }
  button.link { background: transparent; padding: 4px 6px; color: var(--accent); text-decoration: underline; }
  button.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .icon-btn { background: transparent; border: none; padding: 5px; font-size: 15px; color: var(--muted); border-radius: 8px; display: inline-grid; place-items: center; }
  .icon-btn:hover { background: var(--panel-2); color: var(--ink); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

  /* ---------- lists ---------- */
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item .fig { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--panel-2); color: var(--accent); }
  .item .fig .ic { width: 18px; height: 18px; }
  .item .body { flex: 1; min-width: 0; }
  .item .body .t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .body .s { font-size: 12px; color: var(--muted); }
  .item .amt { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
  .amt.pos { color: var(--income); } .amt.neg { color: var(--expense); }
  .item .act { display: flex; gap: 2px; flex: none; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .stat .v { font-size: 19px; font-family: var(--serif); font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat .d { font-size: 11.5px; margin-top: 2px; }
  .delta-up { color: var(--expense); } .delta-down { color: var(--income); }

  /* ---------- bars / progress ---------- */
  .bar { margin: 9px 0; }
  .bar .bl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; align-items: center; gap: 8px; }
  .bar .bl .nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .bar .bl .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .bl .bv { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
  .bar .track { height: 12px; background: var(--panel-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 999px; opacity: .9; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .bar.clickable { cursor: pointer; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .crumbs button { background: transparent; border: none; padding: 3px 5px; color: var(--accent); border-radius: 6px; }
  .crumbs .sep { color: var(--muted); }
  .crumbs .cur { color: var(--ink); font-weight: 600; }

  .trend { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding-top: 6px; }
  .trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .trend .col .b { width: 70%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; opacity: .85; }
  .trend .col .lab { font-size: 10px; color: var(--muted); }
  .trend .col.cur .b { background: var(--ink); opacity: 1; }

  .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pal { border-radius: var(--radius-sm); border: 2px solid var(--line); padding: 8px 6px; text-align: center; font-size: 11.5px; cursor: pointer; background: var(--panel-2); text-transform: capitalize; }
  .pal[aria-pressed="true"] { border-color: var(--accent); }
  .pal .sw { height: 26px; border-radius: 6px; margin-bottom: 5px; }
  .sw-spring { background: linear-gradient(120deg,#fbeef3,#d98aa8,#eef3e6); }
  .sw-summer { background: linear-gradient(120deg,#fff2e0,#e8935f,#ffe6e0); }
  .sw-autumn { background: linear-gradient(120deg,#f6e7d8,#b5652f,#efd9c6); }
  .sw-winter { background: linear-gradient(120deg,#eef2f7,#6d8fb8,#e6ecf3); }

  .toggle { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; }
  .switch .sl { position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; transition: .15s; }
  .switch .sl::before { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: .15s; }
  .switch input:checked + .sl { background: var(--accent); border-color: transparent; }
  .switch input:checked + .sl::before { transform: translateX(20px); background: #fff; }

  .tree-node { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tree-node.l1 { padding-left: 18px; } .tree-node.l2 { padding-left: 36px; }
  .tree-row { display: flex; align-items: center; gap: 8px; }
  .tree-row .nm { flex: 1; display: flex; align-items: center; gap: 8px; }

  .prio { display: inline-flex; gap: 2px; }
  .prio i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .prio i.on { background: var(--accent); }

  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .badge.due { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .badge.late { background: var(--expense); color: #fff; border-color: transparent; }

  /* ---------- modal ---------- */
  dialog { border: none; border-radius: 18px 18px 0 0; padding: 0; width: 100%; max-width: 620px; margin: auto auto 0; background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(40,20,35,.4); }
  .modal-in { padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); position: relative; }
  .modal-in h3 { font-family: var(--serif); font-size: 17px; margin-bottom: 14px; padding-right: 26px; }
  .modal-in .close { position: absolute; top: 10px; right: 12px; background: transparent; border: none; color: var(--muted); padding: 4px; }
  .icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-height: 210px; overflow: auto; padding: 2px; }
  .icon-grid button { padding: 9px 0; background: var(--panel-2); display: grid; place-items: center; color: var(--ink); }
  .icon-grid button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ---------- fx ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .spark { position: absolute; z-index: 200; color: var(--accent); animation: spark .9s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), -74px) rotate(var(--dr)); opacity: 0; } }
  .grow-in { animation: grow .25s ease-out; }
  @keyframes grow { from { transform: scale(.98); opacity: .5; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } .grow-in { animation: none; } .bar .fill { transition: none; } }

  /* ---------- page motifs (mobile-first) ---------- */
  .icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
  /* Log — a mini log book: flat spine on the left, rounded pages on the right */
  main[data-page="log"] > .card {
    border-left: 3px solid var(--accent);
    border-radius: 4px var(--radius) var(--radius) 4px;
    box-shadow: 0 6px 20px -12px var(--glow), -2px 0 0 var(--accent-soft), 0 1px 2px rgba(0,0,0,.03);
  }
  /* Credits — a rolled credit sheet: soft curl shading top and bottom */
  main[data-page="cards"] > .card {
    border-radius: 5px;
    background:
      radial-gradient(100% 9px at 50% 0, rgba(60,35,50,.09), transparent) top center / 100% 12px no-repeat,
      radial-gradient(100% 9px at 50% 100%, rgba(60,35,50,.09), transparent) bottom center / 100% 12px no-repeat,
      var(--panel);
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" data-action="menu" aria-label="Menu" aria-expanded="false"><svg class="ic nav"><use href="#i-menu"/></svg></button>
    <span class="mark"><svg class="ic lg"><use href="#i-potion"/></svg></span>
    <h1>Grimoire</h1>
    <span class="sub" id="topSub"></span>
  </header>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" data-action="menu"></div>
<nav class="drawer" id="drawer" aria-label="Pages">
  <div class="brand"><span class="mark"><svg class="ic lg"><use href="#i-potion"/></svg></span><b>Grimoire</b></div>
  <button class="nav-item" data-action="nav" data-page="log"><svg class="ic nav"><use href="#i-feather"/></svg> Log</button>
  <button class="nav-item" data-action="nav" data-page="cards"><svg class="ic nav"><use href="#i-scroll"/></svg> Credits</button>
  <button class="nav-item" data-action="nav" data-page="charts"><svg class="ic nav"><use href="#i-moon"/></svg> Charts</button>
  <button class="nav-item" data-action="nav" data-page="objectives"><svg class="ic nav"><use href="#i-target"/></svg> Objectives</button>
  <button class="nav-item" data-action="nav" data-page="accounts"><svg class="ic nav"><use href="#i-jar"/></svg> Accounts</button>
  <button class="nav-item" data-action="nav" data-page="setup"><svg class="ic nav"><use href="#i-book"/></svg> Setup</button>
  <div class="foot">Local only · export to back up</div>
</nav>

<dialog id="modal"><div class="modal-in" id="modalBody"></div></dialog>
<div id="fx"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="sprite">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script>
"use strict";
/* ============================================================
   Grimoire — local personal finance grimoire.
   Phase 1: expenses/income, 3-level categories, credit-card cierre
            + MSI without double-counting, balances, charts.
   Phase 2: drill-down charts, savings objectives, recurrence, buckets.

   CORE RULE — money is never counted twice:
     "Spending (by category)" = every expense at full value on its date.
     "Cash out" = money that left an account (income - cash/debit spend
                  - card payments). A card purchase moves no balance until
                  its statement is paid; paying a card is settlement, not
                  a new expense.

   Cierre convention: a purchase dated strictly BEFORE the card's cutover
   day is in the statement closing this month; on/after it, next month.
   The payment due date = the card's due day, N months after the closing
   month (N = card.dueMonthOffset, default 1). Any statement's due date
   can be overridden by hand and reset to auto later.
   ============================================================ */

/* ---------- icon set (simple hand-drawn line art, 24px grid) ---------- */
var ICON_PATHS = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  feather: '<path d="M19 5c-4 0-9 2-11 8l-3 6"/><path d="M19 5c1 5-2 10-8 11l-4 1"/><path d="M14 8l-6 6M16 12l-7 1"/>',
  card: '<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
  moon: '<path d="M17 15A7 7 0 0 1 9 5a7 7 0 1 0 8 10z"/><path d="M17 4l.6 1.6L19 6l-1.4.4L17 8l-.6-1.6L15 6l1.4-.4z"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  jar: '<path d="M7 8h10v9a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z"/><path d="M8 5h8l-1 3H9z"/><path d="M8 13c2 1.5 6 1.5 8 0"/>',
  book: '<path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h11"/><path d="M10 8h6M10 11h5"/>',
  potion: '<path d="M10 3h4M11 3v4l-4 8a4 4 0 0 0 3.6 6h2.8A4 4 0 0 0 17 15l-4-8V3"/><path d="M8.5 14c2 1 5 1 7 0"/><path d="M12 17v2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 5l4 4"/>',
  trash: '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>',
  chevR: '<path d="M9 5l7 7-7 7"/>',
  chevD: '<path d="M6 9l6 6 6-6"/>',
  check: '<path d="M5 13l4 4L19 7"/>',
  sparkle: '<path d="M12 4l1.6 5L19 11l-5.4 2L12 18l-1.6-5L5 11l5.4-2z"/><path d="M18 4l.7 2 2 .7-2 .7L18 10l-.7-2-2-.7 2-.7z"/>',
  calendar: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',

}

/* ---------- computed views ---------- */
function inMonth(dateStr, monthStr) { return dateStr.slice(0, 7) === monthStr; }
function accountBalance(acc) {
  var bal = acc.openingBalance || 0, since = acc.openingDate || "0000-01-01";
  store.transactions.forEach(function (t) {
    if (t.date < since) return;
    if (t.kind === "income" && t.accountId === acc.id) bal += t.amount;
    if (t.kind === "expense" && t.payment && (t.payment.method === "cash" || t.payment.method === "debit") && t.payment.accountId === acc.id) bal -= t.amount;
  });
  store.cardPayments.forEach(function (p) { if (p.fromAccountId === acc.id && p.date >= since) bal -= p.amountPaid; });
  store.adjustments.forEach(function (a) { if (a.accountId === acc.id && a.date >= since) bal += a.amount; });
  return round2(bal);
}
function monthAccrualSpend(m) { return round2(store.transactions.filter(function (t) { return t.kind === "expense" && inMonth(t.date, m); }).reduce(function (s, t) { return s + t.amount; }, 0)); }
function monthIncome(m) { return round2(store.transactions.filter(function (t) { return t.kind === "income" && inMonth(t.date, m); }).reduce(function (s, t) { return s + t.amount; }, 0)); }
function monthCashOut(m) {
  var direct = store.transactions.filter(function (t) { return t.kind === "expense" && t.payment && (t.payment.method === "cash" || t.payment.method === "debit") && inMonth(t.date, m); }).reduce(function (s, t) { return s + t.amount; }, 0);
  var cardPaid = store.cardPayments.filter(function (p) { return inMonth(p.date, m); }).reduce(function (s, p) { return s + p.amountPaid; }, 0);

}
function recentMonthlySurplus() {

  for (var i = 1; i <= 3; i++) { var mm = monthShift(thisMonthStr(), -i); vals.push(monthIncome(mm) - monthCashOut(mm)); }
  return round2(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
}

/* breakdown at any level: parentId null = top level */
function breakdownAt(monthStr, parentId) {
  var groups = {};
  store.transactions.forEach(function (t) {
    if (t.kind !== "expense" || !inMonth(t.date, monthStr)) return;
    var chain = catChain(t.categoryId);
    var groupNode;
    if (!parentId) groupNode = chain[0];
    else {
      var idx = -1;
      for (var i = 0; i < chain.length; i++) if (chain[i].id === parentId) idx = i;
      if (idx === -1) return; // not under this parent
      groupNode = chain[idx + 1] || chain[idx];
    }
    var gid = groupNode ? groupNode.id : "__unc";
    var isDirect = parentId && groupNode && groupNode.id === parentId;
    if (!groups[gid]) groups[gid] = {
      id: gid, direct: isDirect,
      name: groupNode ? (isDirect ? "In " + groupNode.name + " directly" : groupNode.name) : "Uncategorized",
      icon: groupNode ? groupNode.icon : "sparkle",
      total: 0, hasKids: groupNode && !isDirect && catChildren(groupNode.id).length > 0
    };
    groups[gid].total += t.amount;
  });
  return Object.keys(groups).map(function (k) { groups[k].total = round2(groups[k].total); return groups[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

  year: { label: "Yearly", perMonth: function (a) { return a / 12; } },
  permonth: { label: "X times / month", perMonth: function (a, o) { return a * (o.times || 1); } },

function objSaved(o) { return round2(store.contributions.filter(function (c) { return c.objectiveId === o.id; }).reduce(function (s, c) { return s + c.amount; }, 0)); }
function objMonthlyNeed(o) {

    '<div class="list">' + (lines || '<div class="empty small">No charges.</div>') + pays + "</div>" +
    '<div class="small" style="display:flex;justify-content:space-between;margin-top:6px"><span>Total ' + money(s.total) + " · paid " + money(s.paid) + '</span><b>' + (s.settled ? "Settled ✓" : "Remaining " + money(s.remaining)) + "</b></div>" +
    (!s.settled && s.rawRemaining > 0.005 ? '<button class="chip" style="margin-top:8px" data-action="pay-card" data-id="' + card.id + '" data-cycle="' + s.cycleKey + '">' + ic("check", "sm") + "Register payment</button>" : "") + "</div>";

/* ---------- CHARTS ---------- */
function renderCharts() {
  var m = ui.chartMonth, prev = monthShift(m, -1);
  var spend = monthAccrualSpend(m), cashOut = monthCashOut(m), income = monthIncome(m);
  var reserved = totalMonthlyReserved();
  function delta(now, was) {
    if (!was) return "";
    var pct = Math.round((now - was) / was * 100);
    if (!isFinite(pct) || pct === 0) return '<div class="d muted">same as last month</div>';
    return '<div class="d ' + (pct > 0 ? "delta-up" : "delta-down") + '">' + (pct > 0 ? "▲" : "▼") + " " + Math.abs(pct) + "% vs last month</div>";
  }
  var head = '<div class="card"><h2>' + ic("moon") + " " + esc(monthLabel(m)) + '<span class="spacer"></span>' +
    '<button class="icon-btn" data-action="chart-month" data-dir="-1">' + ic("chevL", "sm") + '</button><button class="icon-btn" data-action="chart-month" data-dir="1">' + ic("chevR", "sm") + '</button></h2>' +
    '<div class="stat-grid">' +
    '<div class="stat"><div class="k">Spending (by category)</div><div class="v">' + money(spend) + "</div>" + delta(spend, monthAccrualSpend(prev)) + "</div>" +
    '<div class="stat"><div class="k">Cash out (left accounts)</div><div class="v">' + money(cashOut) + "</div>" + delta(cashOut, monthCashOut(prev)) + "</div>" +
    '<div class="stat"><div class="k">Income</div><div class="v">' + money(income) + "</div></div>" +
    '<div class="stat"><div class="k">Net cash</div><div class="v">' + signed(round2(income - cashOut)) + "</div></div>" +
    "</div>" +
    (reserved ? '<p class="tiny muted" style="margin-top:8px">Objectives reserve about <b>' + money(reserved) + "</b> a month across all buckets.</p>" : "") +
    '<p class="tiny muted" style="margin-top:6px">“Spending” counts every purchase when it happens. “Cash out” counts money only when it leaves an account.</p></div>';

  // drill-down
  var path = ui.chartPath;
  var parentId = path.length ? path[path.length - 1] : null;
  var groups = breakdownAt(m, parentId);
  var max = groups.reduce(function (x, g) { return Math.max(x, g.total); }, 0);
  var crumbs = '<div class="crumbs"><button data-action="chart-crumb" data-i="-1">All</button>';
  path.forEach(function (id, i) {
    var c = catById(id);
    crumbs += '<span class="sep">›</span>' + (i === path.length - 1 ? '<span class="cur">' + esc(c ? c.name : "?") + "</span>" : '<button data-action="chart-crumb" data-i="' + i + '">' + esc(c ? c.name : "?") + "</button>");
  });
  crumbs += "</div>";
  var bars = groups.length ? groups.map(function (g) {
    var clk = g.hasKids;
    return '<div class="bar' + (clk ? " clickable" : "") + '"' + (clk ? ' data-action="chart-drill" data-id="' + esc(g.id) + '"' : "") + '>' +
      '<div class="bl"><span class="nm">' + ic(g.icon, "sm") + "<span>" + esc(g.name) + "</span>" + (clk ? ic("chevR", "sm") : "") + '</span><span class="bv">' + money(g.total) + "</span></div>" +
      '<div class="track"><div class="fill" style="width:' + (max ? g.total / max * 100 : 0).toFixed(1) + '%"></div></div></div>';
  }).join("") : '<div class="empty">No expenses here in ' + esc(monthLabel(m)) + ".</div>";
  var breakdown = '<div class="card"><h2>' + ic("mushroom") + ' Where it went</h2>' + crumbs + bars + "</div>";

  var tMonths = []; for (var i = 5; i >= 0; i--) tMonths.push(monthShift(thisMonthStr(), -i));
  var tvals = tMonths.map(monthAccrualSpend), tmax = Math.max.apply(null, tvals.concat([1]));
  var trend = '<div class="card"><h2>' + ic("leaf") + ' Last 6 months</h2><div class="trend">' +
    tMonths.map(function (mm, idx) { return '<div class="col' + (mm === thisMonthStr() ? " cur" : "") + '"><div class="b" style="height:' + (tvals[idx] / tmax * 100) + '%"></div><div class="lab">' + mm.slice(5) + "</div></div>"; }).join("") +
    '</div><p class="tiny muted center" style="margin-top:6px">monthly spending by category</p></div>';
  return head + breakdown + trend;
}

/* ---------- OBJECTIVES ---------- */
function renderObjectives() {
  var reserved = totalMonthlyReserved();
  var goals = store.objectives.filter(function (o) { return o.kind === "goal"; });
  var totalSaved = round2(goals.reduce(function (s, o) { return s + objSaved(o); }, 0));
  var totalTarget = round2(goals.reduce(function (s, o) { return s + (o.targetAmount || 0); }, 0));
  var surplus = recentMonthlySurplus();

  var head = '<div class="card"><h2>' + ic("target") + ' Objectives</h2><div class="stat-grid">' +
    '<div class="stat"><div class="k">Reserved / month</div><div class="v">' + money(reserved) + "</div>" +
    (surplus > 0 ? '<div class="d ' + (reserved > surplus ? "delta-up" : "delta-down") + '">' + (reserved > surplus ? "above" : "within") + " ~" + money(surplus) + " recent surplus</div>" : "") + "</div>" +
    '<div class="stat"><div class="k">Saved toward goals</div><div class="v">' + money(totalSaved) + '</div><div class="d muted">of ' + money(totalTarget) + "</div></div></div>" +
    '<div class="btn-row" style="margin-top:12px"><button class="chip" data-action="add-objective">' + ic("plus", "sm") + 'New objective</button><button class="chip" data-action="add-bucket">' + ic("plus", "sm") + "New bucket</button></div></div>";

  var body = "";
  var bucketsWithNone = store.buckets.concat([{ id: "__none", name: "Unsorted", icon: "tag" }]);
  bucketsWithNone.forEach(function (bkt) {
    var list = store.objectives.filter(function (o) { return (o.bucketId || "__none") === bkt.id; })
      .sort(function (a, b) { return (b.priority || 3) - (a.priority || 3); });
    if (!list.length && bkt.id === "__none") return;
    body += '<div class="card"><h2>' + ic(bkt.icon) + " " + esc(bkt.name) + '<span class="spacer"></span>' +
      (bkt.id !== "__none" ? '<button class="icon-btn" data-action="edit-bucket" data-id="' + bkt.id + '">' + ic("pencil", "sm") + "</button>" : "") + "</h2>" +
      (list.length ? list.map(objRow).join("") : '<div class="empty small">No objectives in this bucket.</div>') + "</div>";
  });
  return head + body;
}
function objRow(o) {
  var need = objMonthlyNeed(o);
  var prio = '<span class="prio">' + [1, 2, 3, 4, 5].map(function (n) { return '<i class="' + (n <= (o.priority || 3) ? "on" : "") + '"></i>'; }).join("") + "</span>";
  var inner;
  if (o.kind === "goal") {
    var saved = objSaved(o), pct = o.targetAmount ? Math.min(100, saved / o.targetAmount * 100) : 0;
    var months = Math.max(1, monthsUntil(o.targetDate));
    inner = '<div class="bar" style="margin:8px 0 4px"><div class="bl"><span class="nm">' + prio + "<span>" + esc(o.name) + '</span></span><span class="bv">' + money(saved) + " / " + money(o.targetAmount || 0) + '</span></div>' +
      '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="tiny muted" style="margin-top:4px">' + (need > 0 ? money(need) + "/mo to reach " + dateLabel(o.targetDate) + " (" + months + " mo left)" : "target reached 🌟") + "</div></div>";
  } else {
    var r = (RECUR[o.recurrence && o.recurrence.every] || RECUR.month).label;
    var got = objContributedThisMonth(o);
    inner = '<div class="bar" style="margin:8px 0 4px"><div class="bl"><span class="nm">' + prio + "<span>" + esc(o.name) + '</span></span><span class="bv">' + money(need) + "/mo</span></div>" +
      '<div class="track"><div class="fill" style="width:' + (need ? Math.min(100, got / need * 100) : 0).toFixed(1) + '%"></div></div>' +
      '<div class="tiny muted" style="margin-top:4px">' + esc(r) + (o.times ? " ×" + o.times : "") + " · " + money(o.targetAmount || 0) + " each · " + money(got) + " set aside this month</div></div>";
  }
  return '<div class="item">' + figog(o.icon) + '<div class="body">' + inner + "</div>" +
    '<span class="act"><button class="icon-btn" data-action="contribute" data-id="' + o.id + '">' + ic("plus", "sm") + '</button>' +
    '<button class="icon-btn" data-action="edit-objective" data-id="' + o.id + '">' + ic("pencil", "sm") + "</button></span></div>";
}

        '<span class="act"><button class="icon-btn" data-action="edit-card" data-id="' + c.id + '">' + ic("pencil", "sm") + '</button><button class="icon-btn" data-action="del-card" data-id="' + c.id + '">' + ic("trash", "sm") + "</button></span></div>";

document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ui.menuOpen) setMenu(false); });

document.body.addEventListener("click", function (e) {
  var setBtn = e.target.closest("[data-draft-set],[data-edit-set],[data-obj-set]");
  if (setBtn) {
    if (setBtn.dataset.draftSet) {
      syncDraft();
      var k = setBtn.dataset.draftSet; ui.draft[k] = setBtn.dataset.val;
      if (k === "method" && setBtn.dataset.val !== "credit") ui.draft.accountId = firstAccountId(setBtn.dataset.val === "debit" ? "debit" : "cash");
      render();
    } else if (setBtn.dataset.editSet) { ui._editDraft[setBtn.dataset.editSet] = setBtn.dataset.val; renderEditModal(); }
    else { syncObjDraft(); ui._objDraft[setBtn.dataset.objSet] = setBtn.dataset.val; renderObjectiveModal(); }
    return;
  }

  var t = e.target.closest("[data-action]");
  if (!t) return;
  var a = t.dataset.action;

  if (a === "menu") { setMenu(!ui.menuOpen); return; }
  if (a === "nav") { ui.tab = t.dataset.page; ui.chartPath = []; ui.openCard = null; setMenu(false); render(); return; }
  if (a === "close-modal") { closeModal(); return; }

  if (a === "log-month") { ui.logMonth = monthShift(ui.logMonth, +t.dataset.dir); render(); return; }
  if (a === "chart-month") { ui.chartMonth = monthShift(ui.chartMonth, +t.dataset.dir); ui.chartPath = []; render(); return; }
  if (a === "chart-drill") { ui.chartPath = ui.chartPath.concat([t.dataset.id]); render(); return; }
  if (a === "chart-crumb") { var i = +t.dataset.i; ui.chartPath = i < 0 ? [] : ui.chartPath.slice(0, i + 1); render(); return; }

  if (a === "edit-txn") { editTxnModal(t.dataset.id); return; }
  if (a === "log-recur") {
    var src = store.transactions.find(function (x) { return x.id === t.dataset.id; });
    if (src && src.recurrence && src.recurrence.every) {
      if (!src.recurrence.seriesId) src.recurrence.seriesId = uid();
      var nd = nextRecurDate(src.date, src.recurrence.every);
      store.transactions.push({
        id: uid(), kind: "income", amount: src.amount, date: nd, note: "", _o: Date.now(),
        accountId: src.accountId, source: src.source,
        recurrence: { every: src.recurrence.every, seriesId: src.recurrence.seriesId }
      });
      saveStore();
      var rb = t.getBoundingClientRect(); sparkle(rb.left, rb.top);
      render();
    }
    return;
  }
  if (a === "del-txn") {
    if (confirm("Delete this entry?")) {
      store.transactions = store.transactions.filter(function (x) { return x.id !== t.dataset.id; });
      ui.backfillLog = ui.backfillLog.filter(function (x) { return x.id !== t.dataset.id; });
      saveStore(); closeModal(); render();
    }
    return;
  }

  if (a === "add-card") { cardModal(null); return; }
  if (a === "edit-card") { cardModal(t.dataset.id); return; }
  if (a === "del-card") {
    if (store.transactions.some(function (x) { return x.payment && x.payment.cardId === t.dataset.id; })) { alert("This card has purchases logged against it. Reassign or delete those entries first."); return; }
    if (confirm("Delete this card?")) { store.cards = store.cards.filter(function (c) { return c.id !== t.dataset.id; }); store.statementOverrides = store.statementOverrides.filter(function (o) { return o.cardId !== t.dataset.id; }); saveStore(); render(); }
    return;
  }
  if (a === "toggle-card") { ui.openCard = ui.openCard === t.dataset.id ? null : t.dataset.id; render(); return; }
  if (a === "pay-card") { payCardModal(t.dataset.id, t.dataset.cycle); return; }
  if (a === "edit-stmt") { stmtModal(t.dataset.id, t.dataset.cycle); return; }
  if (a === "reset-stmt") {
    store.statementOverrides = store.statementOverrides.filter(function (o) { return !(o.cardId === t.dataset.card && o.cycleKey === t.dataset.cycle); });
    saveStore(); closeModal(); render(); return;
  }
  if (a === "del-payment") { if (confirm("Remove this payment?")) { store.cardPayments = store.cardPayments.filter(function (p) { return p.id !== t.dataset.id; }); saveStore(); render(); } return; }

  if (a === "add-account") { accountModal(null); return; }
  if (a === "edit-account") { accountModal(t.dataset.id); return; }
  if (a === "archive-account") { var acc = accById(t.dataset.id); if (acc) { acc.archived = true; saveStore(); closeModal(); render(); } return; }
  if (a === "adjust-account") { adjustModal(t.dataset.id); return; }
  if (a === "set-default-account") {
    store.settings.defaultAccountId = store.settings.defaultAccountId === t.dataset.id ? "" : t.dataset.id;
    saveStore(); render(); return;
  }
  if (a === "del-adjustment") { if (confirm("Remove this adjustment?")) { store.adjustments = store.adjustments.filter(function (x) { return x.id !== t.dataset.id; }); saveStore(); render(); } return; }

  if (a === "add-cat") { catModal(null, t.dataset.parent || null); return; }
  if (a === "edit-cat") { catModal(t.dataset.id, null); return; }
  if (a === "del-cat") {
    var cid = t.dataset.id;
    if (catChildren(cid).length) { alert("Delete or move the subcategories first."); return; }
    var node = catById(cid);
    if (confirm('Delete "' + node.name + '"? Entries in it move to ' + (node.parentId ? catById(node.parentId).name : "Uncategorized") + ".")) {
      store.transactions.forEach(function (x) { if (x.categoryId === cid) x.categoryId = node.parentId || null; });
      store.categories = store.categories.filter(function (c) { return c.id !== cid; });
      saveStore(); render();
    }
    return;
  }

  if (a === "add-bucket") { bucketModal(null); return; }
  if (a === "edit-bucket") { bucketModal(t.dataset.id); return; }
  if (a === "del-bucket") {
    var bid = t.dataset.id;
    if (confirm("Delete this bucket? Its objectives become unsorted.")) {
      store.objectives.forEach(function (o) { if (o.bucketId === bid) o.bucketId = ""; });
      store.buckets = store.buckets.filter(function (b) { return b.id !== bid; });
      saveStore(); render();
    }
    return;
  }
  if (a === "add-objective") { objectiveModal(null); return; }
  if (a === "edit-objective") { objectiveModal(t.dataset.id); return; }
  if (a === "del-objective") {
    var oid = t.dataset.id;
    if (confirm("Delete this objective and its contributions?")) {
      store.objectives = store.objectives.filter(function (o) { return o.id !== oid; });
      store.contributions = store.contributions.filter(function (c) { return c.objectiveId !== oid; });
      saveStore(); closeModal(); render();
    }
    return;
  }
  if (a === "contribute") { contributeModal(t.dataset.id); return; }
  if (a === "del-contribution") {
    store.contributions = store.contributions.filter(function (c) { return c.id !== t.dataset.id; });
    saveStore(); contributeModal(t.dataset.obj); render(); return;
  }

  if (a === "set-palette") { store.settings.palette = t.dataset.p; store.settings.paletteAuto = false; saveStore(); render(); return; }

  if (a === "export") {
    var blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
    var link = document.createElement("a"); link.href = URL.createObjectURL(blob);
    link.download = "grimoire-backup-" + todayStr() + ".json"; link.click(); URL.revokeObjectURL(link.href);
    return;
  }
  if (a === "import") { document.getElementById("importFile").click(); return; }
  if (a === "wipe") {
    if (confirm("Erase ALL data and start fresh? Export first if unsure.")) {
      localStorage.removeItem(KEY); store = defaultStore(); saveStore(); ui.draft = freshDraft(); render();
    }
    return;
  }
});

    }
    if (k === "l2") {
      if (v === "__new") { var n2 = prompt("New detail name:"); if (n2) { var c2 = { id: uid(), name: n2.trim(), parentId: ui.draft.l1, icon: "sparkle" }; store.categories.push(c2); saveStore(); ui.draft.l2 = c2.id; } else ui.draft.l2 = ""; }
      else ui.draft.l2 = v;
      render(); return;
    }
    ui.draft[k] = v;
  }
  if (el.closest("#quickForm") && el.dataset.draftCheck === "msiOn") { ui.draft.msiOn = el.checked; render(); return; }
  if (el.closest("#editForm") && el.dataset.edit) {
    var ek = el.dataset.edit;
    if (ek === "l0") { ui._editDraft.l0 = el.value; ui._editDraft.l1 = ""; ui._editDraft.l2 = ""; renderEditModal(); return; }
    if (ek === "l1") { ui._editDraft.l1 = el.value; ui._editDraft.l2 = ""; renderEditModal(); return; }
    ui._editDraft[ek] = el.value;
  }
  if (el.closest("#editForm") && el.dataset.editCheck === "msiOn") { ui._editDraft.msiOn = el.checked; renderEditModal(); return; }
  if (el.closest("#objectiveForm") && el.dataset.o) {
    syncObjDraft();
    if (el.dataset.o === "every") { renderObjectiveModal(); return; }
    ui._objDraft[el.dataset.o] = el.value;
  }
  if (el.id === "importFile") { handleImport(el.files[0]); el.value = ""; }
});

document.body.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === "quickForm") { submitQuickAdd(); return; }
  if (f.id === "editForm") { submitEdit(); return; }
  if (f.id === "cardForm") {
    var id = f.dataset.id, obj = id ? cardById(id) : { id: uid() };
    obj.name = f.querySelector("[data-f=name]").value.trim();
    obj.cutoverDay = clampInt(f.querySelector("[data-f=cutoverDay]").value, 1, 31, 15);
    obj.dueDay = clampInt(f.querySelector("[data-f=dueDay]").value, 1, 31, 5);
    obj.dueMonthOffset = clampInt(f.querySelector("[data-f=dueMonthOffset]").value, 0, 2, 1);
    obj.icon = pickedIcon(f, "icon") || obj.icon || "card"; obj.archived = false;
    if (!id) store.cards.push(obj);
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "stmtForm") {
    var scardId = f.dataset.card, scycleKey = f.dataset.cycle, scard = cardById(scardId);
    var sdue = f.querySelector("[data-f=dueDate]").value;
    var ssettled = f.querySelector("[data-f=settled]").checked;
    var sauto = autoDueDate(scycleKey, scard);
    var dueOv = (sdue && sdue !== sauto) ? sdue : undefined;
    store.statementOverrides = store.statementOverrides.filter(function (x) { return !(x.cardId === scardId && x.cycleKey === scycleKey); });
    if (dueOv || ssettled) store.statementOverrides.push({ id: uid(), cardId: scardId, cycleKey: scycleKey, dueDate: dueOv, settled: ssettled });
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "accountForm") {
    var aid = f.dataset.id, acc = aid ? accById(aid) : { id: uid() };
    acc.name = f.querySelector("[data-f=name]").value.trim();
    acc.kind = f.querySelector("[data-f=kind]").value;
    acc.openingBalance = parseFloat(f.querySelector("[data-f=openingBalance]").value) || 0;
    acc.openingDate = f.querySelector("[data-f=openingDate]").value || todayStr();
    acc.icon = pickedIcon(f, "icon") || acc.icon || "wallet"; acc.archived = false;
    if (!aid) store.accounts.push(acc);
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "adjustForm") {
    var acc2 = accById(f.dataset.id), cur = accountBalance(acc2);
    var target = f.querySelector("[data-f=target]").value, delta = f.querySelector("[data-f=delta]").value;
    var amt = target !== "" ? round2(parseFloat(target) - cur) : round2(parseFloat(delta) || 0);
    if (!amt) { alert("Nothing to adjust."); return; }
    store.adjustments.push({ id: uid(), accountId: acc2.id, date: f.querySelector("[data-f=date]").value || todayStr(), amount: amt, note: f.querySelector("[data-f=note]").value.trim() });
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "payForm") {
    var amount = round2(parseFloat(f.querySelector("[data-f=amount]").value) || 0);
    if (amount <= 0) { alert("Enter an amount."); return; }
    store.cardPayments.push({ id: uid(), cardId: f.dataset.card, cycleKey: f.dataset.cycle, amountPaid: amount, date: f.querySelector("[data-f=date]").value || todayStr(), fromAccountId: f.querySelector("[data-f=fromAccountId]").value });
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "catForm") {
    var ccid = f.dataset.id, name = f.querySelector("[data-f=name]").value.trim();
    var parentId = f.querySelector("[data-f=parentId]").value || null, icon = pickedIcon(f, "icon") || "leaf";
    if (ccid) {
      if (parentId && (parentId === ccid || isDescendant(parentId, ccid))) { alert("Can't move a category into itself."); return; }
      if (parentId && catLevel(catById(parentId)) + 1 + subtreeDepth(ccid) > 2) { alert("That move would nest deeper than 3 levels."); return; }
      var node = catById(ccid); node.name = name; node.parentId = parentId; node.icon = icon;
    } else store.categories.push({ id: uid(), name: name, parentId: parentId, icon: icon });
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "bucketForm") {
    var bid = f.dataset.id, b = bid ? bucketById(bid) : { id: uid() };
    b.name = f.querySelector("[data-f=name]").value.trim();
    b.icon = pickedIcon(f, "icon") || b.icon || "suitcase";
    if (!bid) store.buckets.push(b);
    saveStore(); closeModal(); render(); return;
  }
  if (f.id === "objectiveForm") { submitObjective(f); return; }
  if (f.id === "contributeForm") {
    var o = objById(f.dataset.id);
    var amt2 = round2(parseFloat(f.querySelector("[data-f=amount]").value) || 0);
    if (amt2 === 0) { alert("Enter an amount."); return; }
    store.contributions.push({ id: uid(), objectiveId: o.id, amount: amt2, date: f.querySelector("[data-f=date]").value || todayStr() });
    saveStore(); closeModal(); render();
    return;
  }
});

function deepestCat(d) { return d.l2 || d.l1 || d.l0 || null; }
function submitQuickAdd() {
  syncDraft();
  var d = ui.draft, amount = round2(parseFloat(d.amount));
  if (!(amount > 0)) { alert("Enter an amount."); return; }
  var txn = { id: uid(), kind: d.kind, amount: amount, date: d.date || todayStr(), note: (d.note || "").trim(), _o: Date.now() };
  if (d.kind === "expense") {
    if (!deepestCat(d)) { alert("Pick a category."); return; }
    txn.categoryId = deepestCat(d);
    if (d.method === "credit") {
      if (!store.cards.length) { alert("Add a card in Setup first, or choose cash/debit."); return; }
      txn.payment = { method: "credit", cardId: d.cardId || store.cards[0].id };
      txn.msi = d.msiOn ? { installments: clampInt(d.msiN, 2, 48, 6) } : false;
    } else { txn.payment = { method: d.method, accountId: d.accountId || firstAccountId(d.method) }; txn.msi = false; }
  } else {
    txn.accountId = d.accountId || firstAccountId("debit"); txn.source = (d.source || "").trim();
    if (d.incomeEvery && INCOME_RECUR[d.incomeEvery]) txn.recurrence = { every: d.incomeEvery, seriesId: uid() };
  }
  store.transactions.push(txn); saveStore();
  if (ui.backfill) ui.backfillLog.push(txn);
  var keep = { date: ui.backfill ? d.date : todayStr(), method: d.method, cardId: d.cardId, accountId: d.accountId, kind: d.kind };
  ui.draft = freshDraft();
  ui.draft.date = keep.date; ui.draft.method = keep.method; ui.draft.cardId = keep.cardId; ui.draft.accountId = keep.accountId; ui.draft.kind = keep.kind;
  render();
  var btn = document.querySelector("#quickForm button.primary");
  if (btn) { var r = btn.getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top); }
  var amtField = document.querySelector("#quickForm [data-draft=amount]"); if (amtField) amtField.focus();
}
function submitEdit() {
  var d = ui._editDraft, id = ui._editId;
  var t = store.transactions.find(function (x) { return x.id === id; });
  if (!t) { closeModal(); return; }
  var amount = round2(parseFloat(d.amount));
  if (!(amount > 0)) { alert("Enter an amount."); return; }
  t.kind = d.kind; t.amount = amount; t.date = d.date || t.date; t.note = (d.note || "").trim();
  if (d.kind === "expense") {
    var cat = d.l2 || d.l1 || d.l0;
    if (!cat) { alert("Pick a category."); return; }
    t.categoryId = cat; delete t.accountId; delete t.source;
    if (d.method === "credit" && store.cards.length) {
      t.payment = { method: "credit", cardId: d.cardId || store.cards[0].id };
      t.msi = d.msiOn ? { installments: clampInt(d.msiN, 2, 48, 6) } : false;
    } else { t.payment = { method: d.method === "credit" ? "cash" : d.method, accountId: d.accountId || firstAccountId("cash") }; t.msi = false; }
  } else {
    delete t.payment; t.msi = false;
    t.accountId = d.accountId || firstAccountId("debit"); t.source = (d.source || "").trim(); delete t.categoryId;
    if (d.incomeEvery && INCOME_RECUR[d.incomeEvery]) t.recurrence = { every: d.incomeEvery, seriesId: (t.recurrence && t.recurrence.seriesId) || uid() };
    else delete t.recurrence;
  }
  saveStore(); closeModal(); render();
}
function submitObjective(f) {
  syncObjDraft();
  var d = ui._objDraft;
  if (!d.name || !d.name.trim()) { alert("Name the objective."); return; }
  var o = d.id ? objById(d.id) : { id: uid() };
  o.name = d.name.trim();
  o.bucketId = d.bucketId || "";
  o.icon = pickedIcon(f, "icon") || d.icon || "star";
  o.kind = d.kind;
  o.targetAmount = round2(parseFloat(d.targetAmount) || 0);
  o.priority = clampInt(d.priority, 1, 5, 3);
  o.note = (d.note || "").trim();
  o.accountId = d.accountId || firstAccountId("savings");
  if (d.kind === "goal") { o.targetDate = d.targetDate || ""; o.recurrence = null; delete o.times; }
  else {
    o.recurrence = { every: d.every || "month" };
    o.targetDate = (d.every === "once") ? (d.targetDate || "") : "";
    if (d.every === "permonth" || d.every === "peryear") o.times = clampInt(d.times, 1, 60, 1); else delete o.times;
  }
  if (!d.id) store.objectives.push(o);
  saveStore(); closeModal(); render();
}

function handleImport(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.transactions)) throw new Error("not a Grimoire backup");
      if (confirm("Replace all current data with this backup?")) {
        store = data;
        ["accounts", "cards", "categories", "transactions", "cardPayments", "adjustments", "statementOverrides", "buckets", "objectives", "contributions"].forEach(function (k) { if (!Array.isArray(store[k])) store[k] = []; });
        if (!store.settings) store.settings = defaultStore().settings;
        if (store.settings.defaultAccountId == null) store.settings.defaultAccountId = "";
        store.categories.forEach(function (c) { c.icon = iconKey(c.icon); });
        store.accounts.forEach(function (a) { a.icon = iconKey(a.icon); });
        store.cards.forEach(function (c) { c.icon = iconKey(c.icon); if (c.dueMonthOffset == null) c.dueMonthOffset = 1; });
        store.buckets.forEach(function (b) { b.icon = iconKey(b.icon); });
        store.objectives.forEach(function (o) { o.icon = iconKey(o.icon); });
        saveStore(); ui.draft = freshDraft(); render();
      }
    } catch (err) { alert("Could not import: " + err.message); }
  };
  reader.readAsText(file);
}

function sparkle(x, y) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var fx = document.getElementById("fx");
  for (var i = 0; i < 7; i++) {
    var s = document.createElement("span");
    s.className = "spark"; s.innerHTML = ic("sparkle");
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
    s.style.setProperty("--dr", (Math.random() * 360 - 180) + "deg");
    fx.appendChild(s);
    (function (node) { setTimeout(function () { node.remove(); }, 950); })(s);
  }
}

/* ---------- boot ---------- */
buildSprite();
render();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("service-worker.js").catch(function () {});
}
